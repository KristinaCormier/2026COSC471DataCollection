name: Pytest

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  merge_group:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    name: Phase 1 Unit Tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.txt
            requirements*.txt
            pyproject.toml
            setup.cfg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run unit tests (DB-free) with coverage gate
        run: |
          pytest tests/unit/ -v -m "not postgres_only" \
            --cov=utils.collector_shared \
            --cov=utils.data_validation \
            --cov=utils.time_utils \
            --cov=model.orm_db \
            --cov=utils.db_utils \
            --cov=utils.logging_utils \
            --cov-report=term-missing \
            --cov-report=xml:coverage-unit.xml \
            --cov-fail-under=90

      - name: Upload unit coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage-unit.xml

      - name: Upload unit coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage-unit.xml
          flags: unit
          name: coverage-unit
          fail_ci_if_error: false

  integration-tests:
    name: Phase 2 Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    continue-on-error: ${{ github.event_name != 'merge_group' }}
    env:
      TEST_DATABASE_URL: ""
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.txt
            requirements*.txt
            pyproject.toml
            setup.cfg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run integration tests with coverage gate
        run: |
          pytest tests/integration/ -v -m integration \
            --cov=utils.scheduled_pipeline \
            --cov-report=term-missing \
            --cov-report=xml:coverage-integration.xml \
            --cov-fail-under=90

      - name: Upload integration coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: coverage-integration.xml

      - name: Upload integration coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage-integration.xml
          flags: integration
          name: coverage-integration
          fail_ci_if_error: false

  pipeline-tests:
    name: Phase 3 Pipeline Tests
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - integration-tests
    continue-on-error: ${{ github.event_name != 'merge_group' }}
    env:
      FMP_API_KEY: test_api_key
      SYMBOLS: AAPL,MSFT
      MARKET_TZ: America/New_York
      WINDOW_MINUTES: 60
      TEST_DATABASE_URL: ""
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.txt
            requirements*.txt
            pyproject.toml
            setup.cfg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run pipeline tests
        run: |
          pytest tests/pipeline/ -v -m pipeline \
            --cov=intraday_data_collection \
            --cov=run_scheduled_operations \
            --cov-report=term-missing \
            --cov-report=xml:coverage-pipeline.xml \
            --cov-fail-under=90

      - name: Upload pipeline coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-pipeline
          path: coverage-pipeline.xml

      - name: Upload pipeline coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage-pipeline.xml
          flags: pipeline
          name: coverage-pipeline
          fail_ci_if_error: false
